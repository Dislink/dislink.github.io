<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易违禁词检测 | Dislink 工具集</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 21l-4.35-4.35'/%3E%3Ccircle cx='10.5' cy='10.5' r='7'/%3E%3C/svg%3E">
    <style>
        /* ===== Dislink Tools - Unified Stylesheet (inlined) ===== */
        :root {
            --color-bg: #f0f2f5;
            --color-surface: #ffffff;
            --color-surface-alt: #f8fafc;
            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --color-primary-light: #eff6ff;
            --color-text: #1e293b;
            --color-text-secondary: #64748b;
            --color-text-muted: #94a3b8;
            --color-border: #e2e8f0;
            --color-border-strong: #cbd5e1;
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 15px; -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .tool-container { width: 100%; max-width: 800px; margin: 0 auto; }

        /* --- Page Header --- */
        .page-header { text-align: center; margin-bottom: 2rem; }
        .page-header h1 {
            font-size: 1.75rem; font-weight: 700; color: var(--color-text);
            margin-bottom: 0.25rem; letter-spacing: -0.02em;
        }
        .page-header .back-home {
            display: inline-flex; align-items: center; gap: 0.25rem;
            font-size: 0.78rem; font-weight: 500; color: var(--color-text-muted);
            text-decoration: none; margin-bottom: 0.5rem; transition: color 0.15s;
        }
        .page-header .back-home:hover { color: var(--color-primary); }
        .page-header .subtitle { font-size: 0.875rem; color: var(--color-text-secondary); }

        /* --- Cards --- */
        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.25rem;
            overflow: hidden;
        }
        .card-header {
            padding: 0.875rem 1.25rem;
            background: var(--color-surface-alt);
            border-bottom: 1px solid var(--color-border);
            font-weight: 600; font-size: 0.95rem; color: var(--color-text);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card-body { padding: 1.25rem; }

        /* --- Form Controls --- */
        .form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin-bottom: 0.65rem; }
        textarea, input[type="text"] {
            font-family: var(--font-sans); font-size: 0.875rem; padding: 0.45rem 0.65rem;
            border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
            background: var(--color-surface); color: var(--color-text);
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        textarea:hover, input[type="text"]:hover { border-color: var(--color-primary); }
        #inputText { width: 100%; resize: vertical; line-height: 1.6; min-height: 8rem; }
        .unit-label { font-size: 0.8rem; color: var(--color-text-muted); font-weight: 400; }

        /* --- Buttons --- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600;
            padding: 0.6rem 1.5rem; border: none; border-radius: var(--radius-md);
            cursor: pointer; transition: all 0.15s; text-decoration: none;
        }
        .btn-primary { background: var(--color-primary); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* --- Status --- */
        .status-bar {
            padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem;
            background: var(--color-surface-alt); border: 1px solid var(--color-border);
            color: var(--color-text-secondary); min-height: 2.75rem;
            display: flex; align-items: center;
        }
        .status-bar.error { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
        .status-bar.info { background: var(--color-primary-light); border-color: #bfdbfe; color: #1d4ed8; }
        .status-bar .spin {
            width: 0.95rem; height: 0.95rem; border: 2px solid var(--color-primary);
            border-top-color: transparent; border-radius: 50%; margin-right: 0.5rem;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Rule file picker --- */
        .rule-file-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: var(--color-text-secondary); flex-wrap: wrap; }
        .rule-file-row .file-btn {
            font-size: 0.78rem; font-weight: 500; padding: 0.3rem 0.75rem;
            border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
            background: var(--color-surface); color: var(--color-text);
            cursor: pointer; transition: all 0.12s; font-family: var(--font-sans);
        }
        .rule-file-row .file-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .rule-file-row input[type="file"] { display: none; }

        /* --- Match result --- */
        .match-result {
            font-family: var(--font-mono);
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            min-height: 9rem;
            line-height: 2;
            font-size: 0.9rem;
        }
        .result-empty { color: var(--color-text-muted); font-family: var(--font-sans); font-size: 0.85rem; }
        .match {
            background: rgba(239, 68, 68, 0.22);
            border-radius: 3px;
            padding: 0 1px;
            cursor: pointer;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            transition: background 0.12s;
            box-shadow: 0 0 0 1px rgba(239,68,68,0.25);
        }
        .match:hover { background: rgba(239, 68, 68, 0.45); box-shadow: 0 0 0 1px rgba(239,68,68,0.45); }
        .match-count { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.6rem; font-family: var(--font-sans); }

        /* --- Legend --- */
        .legend-title { font-size: 0.8rem; font-weight: 600; color: var(--color-text-secondary); margin: 1rem 0 0.4rem; }
        .legend { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .legend-chip {
            display: inline-flex; align-items: center; gap: 0.35rem;
            font-size: 0.75rem; font-weight: 500; color: var(--color-text);
            padding: 0.2rem 0.6rem; border-radius: 99px;
            background: var(--color-surface-alt); border: 1px solid var(--color-border);
            font-family: var(--font-mono);
        }
        .legend-chip .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; flex-shrink: 0; }

        /* --- Tooltip --- */
        .match-tooltip {
            position: fixed; z-index: 1000; display: none;
            background: var(--color-text); color: #fff;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 0.6rem 0.75rem;
            font-size: 0.78rem;
            max-width: 320px;
            pointer-events: none;
            line-height: 1.5;
        }
        .match-tooltip .tt-title { font-weight: 600; margin-bottom: 0.35rem; color: #fca5a5; font-size: 0.74rem; }
        .match-tooltip .tt-text { font-family: var(--font-mono); color: #f1f5f9; word-break: break-all; margin-bottom: 0.35rem; font-size: 0.74rem; }
        .match-tooltip .tt-group { display: flex; align-items: center; gap: 0.3rem; margin-top: 0.15rem; }
        .match-tooltip .tt-group .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
        .match-tooltip .tt-patterns { color: #cbd5e1; font-size: 0.7rem; margin-left: 0.1rem; }

        /* --- Footer --- */
        .page-footer { text-align: center; padding: 1.5rem 0 0.5rem; font-size: 0.85rem; color: var(--color-text-secondary); }
        .page-footer a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
        .page-footer a:hover { text-decoration: underline; }
        .page-footer .footer-links { display: flex; justify-content: center; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .page-footer .footer-links a { display: inline-flex; align-items: center; gap: 0.25rem; }
        .page-footer .footer-icon { width: 1.25rem; height: 1.25rem; vertical-align: middle; border-radius: 2px; }
        .notice { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.5rem; line-height: 1.5; }

        @media (max-width: 600px) {
            body { padding: 1rem 0.75rem; }
            .page-header h1 { font-size: 1.35rem; }
            .card-body { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="tool-container">
    <div class="page-header">
        <a class="back-home" href="../">← 返回主页</a>
        <h1>网易违禁词检测</h1>
        <div class="subtitle">输入文本并点击「检测」，违禁词将以红色高亮标注</div>
    </div>

    <div class="card">
        <div class="card-header">输入文本</div>
        <div class="card-body">
            <textarea id="inputText" placeholder="在此输入要检测的文本…&#10;例如：§aHello World" rows="6" spellcheck="false"></textarea>
            <div class="form-row" style="margin-top:0.85rem; justify-content:space-between;">
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn btn-primary" id="detectBtn" disabled>检测</button>
                    <button class="btn" id="clearBtn" disabled>清空</button>
                </div>
                <span class="unit-label" id="ruleInfo"></span>
            </div>
            <div class="separator" style="height:1px;background:var(--color-border);margin:0.75rem 0;"></div>
            <div class="rule-file-row">
                <span>规则文件：<b id="ruleName" style="font-family:var(--font-mono);color:var(--color-text);">-</b></span>
                <label class="file-btn" for="ruleFile">更换规则文件…</label>
                <input type="file" id="ruleFile" accept=".pdata,.bin,.dat,.one_z6_acb256,application/octet-stream">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">匹配结果 <span style="font-weight:400;font-size:0.8rem;color:var(--color-text-muted);">悬停红色标注查看命中的正则组</span></div>
        <div class="card-body">
            <div class="status-bar" id="status"><span class="spin"></span>正在加载规则引擎…</div>
            <div class="match-result" id="result"><span class="result-empty">输入文本并点击「检测」，查看匹配结果。</span></div>
            <div class="match-count" id="matchCount" style="display:none;"></div>
            <div class="legend-title" id="legendTitle" style="display:none;">已加载正则组</div>
            <div class="legend" id="legend"></div>
            <p class="notice">提示：匹配结果按字符位置合并为若干高亮片段；同一片段可能命中多个正则组。规则由 WASM 引擎在本地完成匹配，文本不会上传。</p>
        </div>
    </div>

    <div class="page-footer">
        <span>Made by DislinkSforza</span>
        <div class="footer-links">
            <a href="https://qm.qq.com/cgi-bin/qm/qr?k=NQYXkW4V78oAb1jo6ZRA9i_jba2Gw1Hd" target="_blank">
                <img class="footer-icon" referrerpolicy="no-referrer" src="https://qlogo3.store.qq.com/qzone/1600515314/1600515314/100" alt=""> QQ
            </a>
            <a href="https://space.bilibili.com/490775607" target="_blank">
                <img class="footer-icon" src="https://www.bilibili.com/favicon.ico" alt=""> Bilibili
            </a>
            <a href="https://github.com/Dislink" target="_blank">
                <img class="footer-icon" src="https://github.com/favicon.ico" alt=""> GitHub
            </a>
        </div>
    </div>
</div>

    // ---------- dom ----------
    var inputEl = document.getElementById('inputText');
    var detectBtn = document.getElementById('detectBtn');
    var clearBtn = document.getElementById('clearBtn');
    var statusEl = document.getElementById('status');
    var resultEl = document.getElementById('result');
    var matchCountEl = document.getElementById('matchCount');
    var legendTitleEl = document.getElementById('legendTitle');
    var legendEl = document.getElementById('legend');
    var ruleNameEl = document.getElementById('ruleName');
    var ruleInfoEl = document.getElementById('ruleInfo');
    var ruleFileEl = document.getElementById('ruleFile');
    var tooltipEl = document.getElementById('tooltip');

    var GROUP_COLORS = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6'];

    var Module = null;          // g79 wasm module
    var groupNames = [];        // group index -> name
    var totalGroups = 0;
    var totalPatterns = 0;
    var loadedPdataName = null;
    var lastRender = { matches: [] };

    function setStatus(text, cls) {
        statusEl.className = 'status-bar' + (cls ? ' ' + cls : '');
        statusEl.innerHTML = '';
        statusEl.textContent = text;
    }
    function setStatusLoading(text) {
        statusEl.className = 'status-bar';
        statusEl.innerHTML = '';
        var s = document.createElement('span');
        s.className = 'spin';
        statusEl.appendChild(s);
        statusEl.appendChild(document.createTextNode(text));
    }
    function b64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }
    function toNum(p) { return typeof p === 'bigint' ? Number(p) : p; }

    // ---------- load wasm module ----------
    async function loadModule() {
        var blob = new Blob([b64ToBytes(WASM_B64)], { type: 'application/wasm' });
        var url = URL.createObjectURL(blob);
        return await createG79Module({ locateFile: function (p) { return p === 'g79.wasm' ? url : p; } });
    }

    // ---------- load pdata ----------
    async function loadPdata() {
        try {
            var resp = await fetch('rules.pdata');
            if (resp.ok) {
                loadedPdataName = 'rules.pdata';
                return new Uint8Array(await resp.arrayBuffer());
            }
        } catch (e) { /* try next */ }
        loadedPdataName = '(内嵌规则文件 更新于2026/09/02)';
        return b64ToBytes(PDATA_B64);
    }

    // ---------- init engine with pdata bytes ----------
    function initEngine(pdataBytes) {
        var mem8 = new Uint8Array(Module.wasmExports.memory.buffer);
        var pbuf = Module._malloc(pdataBytes.length);
        mem8 = new Uint8Array(Module.wasmExports.memory.buffer); // re-fetch after malloc
        mem8.set(pdataBytes, pbuf);
        var rc = toNum(Module._init(BigInt(pbuf), BigInt(pdataBytes.length)));
        Module._free(pbuf);
        if (rc !== 0) throw new Error('规则初始化失败 (code ' + rc + ')');
        totalGroups = toNum(Module._group_count());
        totalPatterns = toNum(Module._total_codes());
        groupNames = [];
        for (var i = 0; i < totalGroups; i++) {
            var buf = Module._malloc(128);
            Module._group_name(BigInt(i), BigInt(buf), 128n);
            var name = Module.UTF8ToString(buf);
            Module._free(buf);
            groupNames.push(name || String(i));
        }
    }

    // ---------- run match ----------
    function runMatch(text) {
        var bytes = new TextEncoder().encode(text);
        var cap = Math.max(totalPatterns, 1);
        var sbuf = Module._malloc(bytes.length);
        var mem8 = new Uint8Array(Module.wasmExports.memory.buffer);
        mem8.set(bytes, sbuf);
        var rbuf = Module._malloc(cap * 16);
        var count = toNum(Module._match(BigInt(sbuf), BigInt(bytes.length), BigInt(rbuf), BigInt(cap)));
        var mem32 = new Uint32Array(Module.wasmExports.memory.buffer); // memory may have grown
        var base = rbuf / 4;
        var matches = [];
        for (var i = 0; i < count && i < cap; i++) {
            matches.push({
                g: mem32[base + i * 4],
                pattern: mem32[base + i * 4 + 1],
                start: mem32[base + i * 4 + 2],
                end: mem32[base + i * 4 + 3]
            });
        }
        Module._free(sbuf);
        Module._free(rbuf);
        return matches;
    }

    // ---------- byte offsets -> utf16 char offsets ----------
    function byteToCharMap(text) {
        var map = [];
        var byte = 0;
        for (var i = 0; i < text.length; ) {
            map[byte] = i;
            var cp = text.codePointAt(i);
            var charLen = cp > 0xFFFF ? 2 : 1;
            var byteLen;
            if (cp <= 0x7F) byteLen = 1;
            else if (cp <= 0x7FF) byteLen = 2;
            else if (cp <= 0xFFFF) byteLen = 3;
            else byteLen = 4;
            for (var k = 1; k < byteLen; k++) map[byte + k] = i;
            byte += byteLen;
            i += charLen;
        }
        map[byte] = text.length;
        return map;
    }

    // ---------- build highlight runs ----------
    function buildRuns(text, matches) {
        var n = text.length;
        var map = byteToCharMap(text);
        var events = new Array(n + 1);
        for (var i = 0; i <= n; i++) events[i] = null;
        matches.forEach(function (m) {
            var cs = map[m.start];
            var ce = map[m.end];
            if (cs === undefined || ce === undefined || cs >= ce) return;
            var key = m.g + ':' + m.pattern;
            (events[cs] = events[cs] || []).push([1, m.g, m.pattern, key]);  // add
            (events[ce] = events[ce] || []).push([0, m.g, m.pattern, key]);  // remove
        });

        var active = new Map(); // groupIdx -> { name, patterns:Set }
        var runs = [];
        var runStart = 0;
        var runGroups = [];
        var runPatterns = [];
        function curGroups() {
            var arr = [];
            active.forEach(function (v) { arr.push(v.name); });
            arr.sort();
            return arr;
        }
        function same(a, b) {
            if (a.length !== b.length) return false;
            for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
            return true;
        }
        function collectPatterns() {
            var set = new Set();
            active.forEach(function (v) { v.patterns.forEach(function (p) { set.add(p); }); });
            var arr = [];
            set.forEach(function (p) { arr.push(p); });
            arr.sort(function (a, b) { return a - b; });
            return arr;
        }
        for (var i = 0; i <= n; i++) {
            if (events[i]) {
                for (var j = 0; j < events[i].length; j++) {
                    var ev = events[i][j];
                    var gi = ev[1], pi = ev[2];
                    if (ev[0] === 1) {
                        if (!active.has(gi)) active.set(gi, { name: groupNames[gi] || String(gi), patterns: new Set() });
                        active.get(gi).patterns.add(pi);
                    } else {
                        if (active.has(gi)) {
                            var g = active.get(gi);
                            g.patterns.delete(pi);
                            if (g.patterns.size === 0) active.delete(gi);
                        }
                    }
                }
            }
            var gcur = curGroups();
            if (i === 0) { runGroups = gcur; runPatterns = collectPatterns(); continue; }
            if (!same(gcur, runGroups)) {
                if (runStart < i) runs.push({ start: runStart, end: i, groups: runGroups.slice(), patterns: runPatterns.slice() });
                runStart = i;
                runGroups = gcur;
                runPatterns = collectPatterns();
            }
            if (i === n && runStart < i) {
                runs.push({ start: runStart, end: n, groups: gcur.slice(), patterns: runPatterns.slice() });
            }
        }
        return runs;
    }

    // ---------- render ----------
    function renderResult(text, runs) {
        resultEl.innerHTML = '';
        var frag = document.createDocumentFragment();
        var matchCount = 0;
        runs.forEach(function (run) {
            var seg = text.slice(run.start, run.end);
            if (run.groups.length) {
                matchCount++;
                var mark = document.createElement('mark');
                mark.className = 'match';
                mark.textContent = seg;
                mark.dataset.groups = JSON.stringify(run.groups);
                mark.dataset.patterns = JSON.stringify(run.patterns);
                frag.appendChild(mark);
            } else {
                frag.appendChild(document.createTextNode(seg));
            }
        });
        resultEl.appendChild(frag);
        if (matchCount === 0) {
            matchCountEl.style.display = 'block';
            matchCountEl.textContent = '未匹配到任何内容';
        } else {
            matchCountEl.style.display = 'block';
            matchCountEl.textContent = '共 ' + matchCount + ' 处高亮匹配，' + totalGroups + ' 个正则组 / ' + totalPatterns + ' 条规则';
        }
    }

    // ---------- detect ----------
    function detect() {
        var text = inputEl.value;
        if (!Module || !text) return;
        var t0 = performance.now();
        var matches = runMatch(text);
        var runs = buildRuns(text, matches);
        var ms = Math.round(performance.now() - t0);
        lastRender = { matches: matches };
        renderResult(text, runs);
        setStatus('检测完成：' + matches.length + ' 条命中，' + runs.filter(function (r) { return r.groups.length; }).length + ' 处高亮片段（耗时 ' + ms + ' ms）', 'info');
    }

    // ---------- legend ----------
    function renderLegend() {
        legendEl.innerHTML = '';
        if (!totalGroups) return;
        legendTitleEl.style.display = 'block';
        for (var i = 0; i < totalGroups; i++) {
            var chip = document.createElement('span');
            chip.className = 'legend-chip';
            var dot = document.createElement('span');
            dot.className = 'dot';
            dot.style.background = GROUP_COLORS[i % GROUP_COLORS.length];
            chip.appendChild(dot);
            chip.appendChild(document.createTextNode(groupNames[i] + ' · 组 ' + i));
            legendEl.appendChild(chip);
        }
    }

    // ---------- tooltip ----------
    function showTooltip(mark, x, y) {
        var groups;
        var patterns;
        try { groups = JSON.parse(mark.dataset.groups); } catch (e) { groups = []; }
        try { patterns = JSON.parse(mark.dataset.patterns); } catch (e) { patterns = []; }
        var html = '<div class="tt-title">命中 ' + groups.length + ' 个正则组</div>';
        html += '<div class="tt-text">' + escapeHtml(mark.textContent) + '</div>';
        for (var i = 0; i < groups.length; i++) {
            var gidx = groupNames.indexOf(groups[i]);
            var color = GROUP_COLORS[gidx % GROUP_COLORS.length];
            html += '<div class="tt-group"><span class="dot" style="background:' + color + '"></span>' + escapeHtml(groups[i]) + '</div>';
        }
        if (patterns.length) {
            html += '<div class="tt-patterns">规则 #' + patterns.join(', #') + '</div>';
        }
        tooltipEl.innerHTML = html;
        tooltipEl.style.display = 'block';
        positionTooltip(x, y);
    }
    function positionTooltip(x, y) {
        var pad = 12;
        var tw = tooltipEl.offsetWidth;
        var th = tooltipEl.offsetHeight;
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var left = x + pad;
        var top = y + pad;
        if (left + tw > vw - 8) left = x - tw - pad;
        if (top + th > vh - 8) top = y - th - pad;
        tooltipEl.style.left = left + 'px';
        tooltipEl.style.top = top + 'px';
    }
    function hideTooltip() {
        tooltipEl.style.display = 'none';
    }
    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    resultEl.addEventListener('mouseover', function (e) {
        var mark = e.target.closest('.match');
        if (mark) showTooltip(mark, e.clientX, e.clientY);
    });
    resultEl.addEventListener('mousemove', function (e) {
        if (tooltipEl.style.display === 'block') positionTooltip(e.clientX, e.clientY);
    });
    resultEl.addEventListener('mouseout', function (e) {
        if (e.target.closest('.match') && !e.relatedTarget || e.relatedTarget && !e.relatedTarget.closest('.match')) hideTooltip();
    });

    detectBtn.addEventListener('click', detect);
    inputEl.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); detect(); }
    });
    clearBtn.addEventListener('click', function () {
        inputEl.value = '';
        resultEl.innerHTML = '<span class="result-empty">输入文本并点击「检测」，查看匹配结果。</span>';
        matchCountEl.style.display = 'none';
        setStatus('已清空，等待检测。', '');
        inputEl.focus();
    });
    ruleFileEl.addEventListener('change', async function () {
        var file = ruleFileEl.files[0];
        if (!file) return;
        var buf = await file.arrayBuffer();
        try {
            setStatusLoading('正在加载自定义规则文件…');
            initEngine(new Uint8Array(buf));
            loadedPdataName = file.name;
            ruleNameEl.textContent = file.name;
            ruleInfoEl.textContent = totalGroups + ' 组 / ' + totalPatterns + ' 条规则';
            renderLegend();
            setStatus('已加载自定义规则：' + totalGroups + ' 组，' + totalPatterns + ' 条规则', 'info');
            if (inputEl.value) detect();
        } catch (e) {
            setStatus('规则文件加载失败：' + e.message, 'error');
        }
    });

    // ---------- boot ----------
    (async function boot() {
        try {
            setStatusLoading('正在加载规则引擎…');
            Module = await loadModule();
            setStatusLoading('正在加载规则文件…');
            var pdata = await loadPdata();
            initEngine(pdata);
            ruleNameEl.textContent = loadedPdataName;
            ruleInfoEl.textContent = totalGroups + ' 组 / ' + totalPatterns + ' 条规则';
            renderLegend();
            setStatus('规则引擎就绪：' + totalGroups + ' 个正则组，' + totalPatterns + ' 条规则。输入文本后点击「检测」开始匹配。', 'info');
            detectBtn.disabled = false;
            clearBtn.disabled = false;
        } catch (e) {
            console.error(e);
            setStatus('加载失败：' + e.message + '（请确认 g79.wasm / 规则文件与本页面位于同一目录，或通过本地服务器访问）', 'error');
            detectBtn.disabled = true;
        }
    })();
})();
</script>
</body>
</html>
